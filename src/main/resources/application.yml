server:
  port: 8081
  shutdown: graceful
  compression:
    enabled: true
  tomcat:
    max-connections: 30000
    accept-count: 2000
    keep-alive-timeout: 60s

spring:
  lifecycle:
    timeout-per-shutdown-phase: 15s
  application:
    name: tripupdates
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5431/trip_updates_db}
    username: ${SPRING_DATASOURCE_USERNAME:trip_user}
    password: ${SPRING_DATASOURCE_PASSWORD:trip_password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    # no DB connection held for the whole HTTP request (ingest does Redis work after its lookups)
    open-in-view: false
    hibernate:
      # dev default; use `validate` with managed migrations in production
      ddl-auto: ${SPRING_JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.batch_size: 20
        order_inserts: true
        order_updates: true
    show-sql: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 5000ms

# HS256 needs >= 32 bytes; override in every real environment.
jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.example.tripUpdates: INFO
    org.springframework.web.socket: INFO
    org.springframework.data.redis: INFO

# Optional synthetic data for load tests: number of extra cabs (each with one ACTIVE trip). 0 = off.
seed:
  load:
    cabs: ${SEED_LOAD_CABS:0}
