# WebSocket-aware load balancer in front of the gateway nodes.
# least_conn spreads long-lived connections evenly; a node that is down is skipped and its clients reconnect
# (and resume) through here onto the survivors.
worker_processes auto;
events { worker_connections 30000; }

http {
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    upstream gateways {
        least_conn;
        server gateway-1:8081 max_fails=1 fail_timeout=10s;
        server gateway-2:8081 max_fails=1 fail_timeout=10s;
        server gateway-3:8081 max_fails=1 fail_timeout=10s;
        keepalive 256;
    }

    server {
        listen 80;

        location /ws/ {
            proxy_pass http://gateways;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 500ms;   # a killed node's address may not refuse, it may just hang
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 3;
        }

        location /api/ {
            proxy_pass http://gateways;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 500ms;
            proxy_next_upstream error timeout http_503;
            proxy_next_upstream_tries 3;
        }

        # metrics and health are reachable on each node's own port, not through the public entry point
        location /actuator/ { return 404; }
    }
}
